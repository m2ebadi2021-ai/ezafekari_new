name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5   # به‌روزرسانی به v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5  # به‌روزرسانی به v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --info  # افزودن --info برای لاگ بیشتر

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk